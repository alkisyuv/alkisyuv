name: refresh repo pins

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: profile-icons/github-profile-repo-pins@v1
        with:
          gh_api_token: ${{ secrets.GITHUB_TOKEN }}
          gh_username: alkisyuv
          repo_names_exclusive: fleetorders/etymd,fleetorders/peirad,fleetorders/hyphos,fleetorders/herkos,fleetorders/diopsis,fleetorders/extensions
